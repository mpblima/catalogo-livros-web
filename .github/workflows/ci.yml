name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: catalogo_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:catalogo_test@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgresql://postgres:catalogo_test@localhost:5432/postgres?sslmode=disable
      PGPASSWORD: catalogo_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare disposable roles
        run: psql -h localhost -U postgres -c 'create role anon; create role authenticated;'
      - name: Read tested desktop revision
        id: desktop
        run: |
          revision=$(cat .github/desktop-sync-ref)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: mpblima/catalogo-livros
          ref: ${{ steps.desktop.outputs.revision }}
          path: desktop-client
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: desktop-client/pom.xml
      - name: Apply migrations and prove repeatability
        working-directory: backend
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - name: Test permissions, migrations, conflicts and shared catalog
        working-directory: backend
        env:
          DESKTOP_REPO: ${{ github.workspace }}/desktop-client
        run: go test -race ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate operational scripts
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -t catalogo-api:check backend
  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: [backend, frontend, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    concurrency:
      group: catalogo-production
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      EXPECTED_REVISION: ${{ github.sha }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check deployment configuration
        run: python3 scripts/deploy.py preflight
      - name: Install PostgreSQL 17 client and backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ca-certificates curl age
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --location --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: noble-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Back up and test restore before migration
        working-directory: backend
        env:
          BACKUP_OUTPUT: ${{ runner.temp }}/catalogo-before-migration.dump.age
        run: ../scripts/backup.sh
      - name: Keep only encrypted backup
        uses: actions/upload-artifact@v7.0.2
        with:
          name: database-before-${{ github.sha }}
          path: ${{ runner.temp }}/catalogo-before-migration.dump.age
          retention-days: 14
          if-no-files-found: error
      - name: Apply compatible migrations
        working-directory: backend
        run: go run ./cmd/migrate
      - name: Deploy tested backend revision
        run: python3 scripts/deploy.py backend
      - name: Wait for tested backend
        run: python3 scripts/smoke.py --web '' --revision "$EXPECTED_REVISION" --attempts 60
      - name: Check public endpoints
        run: python3 scripts/smoke.py --revision "$EXPECTED_REVISION" --attempts 24
  deployment-setup:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Production deployment is disabled until hooks, database backup and environment are configured. See docs/automacao.md.' >> "$GITHUB_STEP_SUMMARY"
