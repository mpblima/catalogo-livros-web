name: Database backup and restore drill
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogo-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install backup tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-17 age
      - name: Encrypt backup and prove restore
        working-directory: backend
        env:
          BACKUP_OUTPUT: ${{ runner.temp }}/catalogo.dump.age
        run: ../scripts/backup.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: catalogo-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/catalogo.dump.age
          retention-days: 14
          if-no-files-found: error
